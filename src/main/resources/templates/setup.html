<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('首次设置')"></head>
<body>
<header th:replace="fragments/layout :: header"></header>
<main class="container">
    <h1>首次设置</h1>

    <div th:if="${alreadyConfigured}" class="card">
        <p class="ok">✅ TOTP 已配置完成。你无需再次设置。</p>
        <a class="btn" th:href="@{/}">前往首页</a>
    </div>

    <div th:unless="${alreadyConfigured}" class="card">
        <p>用 Authenticator app（如 Google Authenticator / Authy）扫描下面的二维码，完成绑定。</p>
        <div class="qr">
            <img th:src="${qr}" alt="TOTP 二维码">
        </div>
        <p class="muted">扫码后输入 app 中显示的 6 位一次性代码完成激活。</p>
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <form method="post" th:action="@{/setup}" class="inline-form">
            <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                   placeholder="6 位代码" required>
            <button type="submit" class="btn primary">激活</button>
        </form>
    </div>
</main>
</body>
</html>
