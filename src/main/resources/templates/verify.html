<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('TOTP 验证')"></head>
<body>
<header th:replace="fragments/layout :: header"></header>
<main class="container">
    <div class="card narrow">
        <h1>操作验证</h1>
        <p class="muted">请输入 Authenticator app 中的 6 位一次性代码。</p>
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <p th:if="${locked}" class="error">当前已触发失败锁定，请稍后再试。</p>
        <form method="post" th:action="@{/verify}" class="inline-form">
            <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                   placeholder="6 位代码" required autofocus>
            <input type="hidden" name="sessionId" th:value="${sessionId}">
            <input type="hidden" name="returnTo" th:value="${returnTo}">
            <button type="submit" class="btn primary">验证</button>
        </form>
    </div>
</main>
</body>
</html>
