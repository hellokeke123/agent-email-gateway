spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      continue-on-error: false

app:
  auth-code-ttl-minutes: 60
  session-ttl-minutes: 15
  web-session-ttl-minutes: 30
  totp-window: 1
  totp-lock-threshold: 5
  totp-lock-minutes: 1
  base-url: ""
